<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Locum ED HJ Booking</title>
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#14212b;--muted:#5d6b78;--line:#e1e8ed;--brand:#0f766e;--brand-d:#0b5a54;--brand-l:#e1f4f1;--on:#fff;--bad:#b91c1c;--ok:#15803d;--warn:#b45309;--r:16px;--sh:0 1px 2px rgba(16,24,40,.06),0 8px 24px rgba(16,24,40,.07)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1418;--card:#152027;--ink:#e8eef2;--muted:#93a4b1;--line:#263641;--brand:#2dd4bf;--brand-d:#5eead4;--brand-l:#10343a;--on:#04201d;--bad:#f87171;--ok:#4ade80;--warn:#fbbf24;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,p{margin:0}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top .in{max-width:560px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--brand);color:var(--on);display:grid;place-items:center;font-weight:800;letter-spacing:.5px}
.top h1{font-size:17px;line-height:1.2}.top small{color:var(--muted);font-size:12.5px}
.wrap{max-width:560px;margin:auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h2{font-size:22px;margin-bottom:4px}.muted{color:var(--muted)}
.lbl{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input[type=text],input[type=email],input[type=tel],input:not([type]){width:100%;height:52px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:0 14px;font-size:17px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-l)}
input.ro{opacity:.7}input.bad{border-color:var(--bad)}
.big{font-size:22px;letter-spacing:2px;text-align:center;font-variant-numeric:tabular-nums}
.warn{display:flex;gap:10px;background:#fef3c7;color:#78350f;border:1px solid #fcd34d;border-radius:12px;padding:12px;margin-top:14px;font-size:14px;line-height:1.45;text-align:left}
.warn .ic{font-size:20px;line-height:1.2}.warn strong{display:block;font-size:14.5px;margin-bottom:2px}
@media(prefers-color-scheme:dark){.warn{background:#3a2f0b;color:#fde68a;border-color:#7a5c0a}}
.hint{font-size:13px;color:var(--muted);margin-top:6px}.fe{font-size:13px;color:var(--bad);margin-top:6px}
.btn{width:100%;min-height:52px;border:0;border-radius:12px;background:var(--brand);color:var(--on);font-size:17px;font-weight:700;cursor:pointer;margin-top:20px;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);margin-top:10px}
.btn.danger{background:var(--bad);color:#fff}
.link{background:none;border:0;color:var(--brand);font-weight:600;font-size:14px;padding:8px 4px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{position:relative}.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:grid;place-items:center;height:48px;border:1.5px solid var(--line);border-radius:12px;font-weight:600;background:var(--bg)}
.opt input:checked+span{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)}
.opt input:focus-visible+span{box-shadow:0 0 0 4px var(--brand-l)}
.me{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:grid;place-items:center;font-weight:800}
.me b{display:block}.me small{color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--brand-l);color:var(--brand-d)}
.badge.hol{background:#fef3c7;color:#92400e}
.sec{font-size:15px;margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec span{color:var(--muted);font-weight:500;font-size:13px}
.dates{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:4px 2px 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.d{flex:0 0 58px;scroll-snap-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 0;text-align:center;cursor:pointer;color:var(--ink);font:inherit}
.d small{display:block;color:var(--muted);font-size:12px}.d b{display:block;font-size:20px;line-height:1.2}
.d i{display:block;width:7px;height:7px;border-radius:50%;margin:5px auto 0;background:var(--ok)}
.d.full i{background:var(--bad)}.d.closed{opacity:.45}.d.closed i{background:var(--muted)}
.d.sel{background:var(--brand);border-color:var(--brand);color:var(--on)}.d.sel small{color:var(--on);opacity:.85}.d.sel i{background:var(--on)}
.slots{display:grid;gap:12px}
.slot{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;box-shadow:var(--sh);transition:transform .1s,border-color .15s}
.slot.open:hover{border-color:var(--brand)}.slot.open:active{transform:scale(.99)}
.slot[disabled]{cursor:default;box-shadow:none;opacity:.75}
.slot .t{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:700}
.st{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.st.open{background:var(--brand-l);color:var(--brand-d)}.st.full{background:#fee2e2;color:#991b1b}.st.closed{background:var(--line);color:var(--muted)}.st.booked{background:#dcfce7;color:#166534}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.chip.you{border-color:var(--brand);color:var(--brand-d);background:var(--brand-l);font-weight:600}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:14px}
@keyframes sh{to{background-position:-200% 0}}
.item{display:grid;gap:4px;margin-bottom:12px}
.item .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item h3{font-size:17px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font:600 13px system-ui;padding:10px 0;min-height:58px;cursor:pointer;display:grid;gap:2px;justify-items:center}
nav.tabs button.on{color:var(--brand)}
nav.tabs svg{width:24px;height:24px}
.back{position:fixed;inset:0;background:rgba(5,12,16,.5);z-index:10;opacity:0;transition:opacity .2s}.back.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--card);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:auto;transform:translateY(100%);transition:transform .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none}
.sheet h3{font-size:20px;margin-bottom:12px}
dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;font-weight:600;word-break:break-word}
.tick{width:72px;height:72px;margin:6px auto 12px;display:block}
.tick circle{fill:var(--brand-l)}.tick path{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:dr .5s .15s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#111c22;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.fade{animation:f .3s ease}@keyframes f{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in"><div class="logo">ED</div><div><h1>Locum ED HJ Booking</h1><small>Kesihatan Awam · Book your slot</small></div></div></header>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="book" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>Book</button>
  <button data-tab="mine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>My bookings</button>
</nav>
<div class="back" id="back" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG=window.APP_CONFIG||{};
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var app=$('#app');
var S={session:null,avail:null,availAt:0,mine:null,sel:null};
var ROLE={MO:{short:'MO',name:'Medical Officer',reg:'MMC registration number'},AMO:{short:'AMO',name:'Assistant Medical Officer',reg:'Medical Assistants Board reg. no.'},NURSE:{short:'Nurse',name:'Nurse',reg:'Nursing Board reg. no. (APC)'}};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pd=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var CUTOFF=24;
function warnBox(title,html){return '<div class="warn" role="note"><span class="ic">⚠️</span><div><strong>'+title+'</strong>'+html+'</div></div>'}
function lastMinuteWarn(){return warnBox('Last-minute cancellation','You can cancel here until '+CUTOFF+' hours before your slot. After that, you must <b>find a replacement yourself</b> and contact the admin to cancel your slot and pass it to the new booker. Please book only if you can attend.')}
function cancelDeadline(b,h){var s=pd(b.date);s.setHours(+b.slot.slice(0,2),+b.slot.slice(2,4),0,0);return new Date(s.getTime()-h*3600000).toLocaleString('en-MY',{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})}
var fmtLong=function(s){return pd(s).toLocaleDateString('en-MY',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};

/* ---------- session ---------- */
function loadSession(){try{var s=JSON.parse(sessionStorage.getItem('sess'));if(s&&s.token)return s}catch(e){}return null}
function saveSession(s){S.session=s;try{sessionStorage.setItem('sess',JSON.stringify(s))}catch(e){}}
function logout(){S.session=null;S.mine=null;S.avail=null;try{sessionStorage.removeItem('sess')}catch(e){}viewIC()}

/* ---------- ui helpers ---------- */
var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},3500)}
function busy(b,on,txt){if(!b)return;if(on){b.dataset.t=b.textContent;b.disabled=true;b.textContent=txt||'Please wait…'}else{b.disabled=false;b.textContent=b.dataset.t||b.textContent}}
function tabs(show,active){var n=$('#tabs');n.hidden=!show;$$('button',n).forEach(function(b){b.classList.toggle('on',b.dataset.tab===active)})}
function openSheet(html){var s=$('#sheet'),b=$('#back');s.innerHTML=html;s.hidden=false;b.hidden=false;requestAnimationFrame(function(){s.classList.add('on');b.classList.add('on')});var f=$('button',s);if(f)f.focus();$$('[data-close]',s).forEach(function(x){x.onclick=closeSheet})}
function closeSheet(){var s=$('#sheet'),b=$('#back');s.classList.remove('on');b.classList.remove('on');setTimeout(function(){s.hidden=true;b.hidden=true},250)}
$('#back').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
function fail(e){if(e&&e.expired){toast('Session expired. Please sign in again.');logout()}else toast(e&&e.message||'Something went wrong.')}

/* ---------- api ---------- */
function api(action,data,get){
  var ctl=new AbortController(),t=setTimeout(function(){ctl.abort()},25000);
  var req=get?fetch(CFG.API_URL+'?action='+action,{signal:ctl.signal}):fetch(CFG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:action},data||{})),signal:ctl.signal});
  return req.then(function(r){return r.json()}).then(function(j){
    if(!j.ok){var e=new Error(j.error||'Something went wrong.');if(/session/i.test(j.error||''))e.expired=true;throw e}
    return j;
  },function(e){
    if(e.name==='AbortError')throw new Error('Connection timed out. Please try again.');
    throw new Error('Cannot reach the server. Check your connection.');
  }).then(function(j){clearTimeout(t);return j},function(e){clearTimeout(t);throw e});
}

/* ---------- step 1: IC ---------- */
function viewIC(){
  tabs(false);
  app.innerHTML='<section class="card fade"><h2>Welcome</h2><p class="muted">Enter your IC number. If you have booked before, your details are filled in for you.</p>'+
  '<label class="lbl" for="ic">IC number</label><input id="ic" class="big" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="000000000000" aria-describedby="icH">'+
  '<p class="hint" id="icH">0/12 digits · no dashes</p><div id="s2"></div></section>';
  var ic=$('#ic'),checking=false;ic.focus();
  ic.addEventListener('input',function(){
    ic.value=ic.value.replace(/\D/g,'').slice(0,12);
    $('#icH').textContent=ic.value.length+'/12 digits · no dashes';
    if(ic.value.length<12){$('#s2').innerHTML='';return}
    if(checking)return;checking=true;ic.blur();
    $('#icH').textContent='Checking…';
    api('check',{ic:ic.value}).then(function(r){
      checking=false;
      if(!r.exists)return viewRegister(ic.value,false);
      $('#icH').textContent='Welcome back!';
      $('#s2').innerHTML='<label class="lbl" for="l4">Last 4 digits of your phone number</label><input id="l4" class="big" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••"><p class="hint">Just to confirm it\'s you.</p>';
      var l4=$('#l4');l4.focus();
      l4.addEventListener('input',function(){
        l4.value=l4.value.replace(/\D/g,'').slice(0,4);
        if(l4.value.length<4)return;
        l4.disabled=true;
        api('login',{ic:ic.value,last4:l4.value}).then(function(j){saveSession({token:j.token,profile:j.profile});viewBook()},function(e){toast(e.message);l4.disabled=false;l4.value='';l4.focus()});
      });
    },function(e){checking=false;$('#icH').textContent=ic.value.length+'/12 digits';toast(e.message);ic.focus()});
  });
}

/* ---------- registration / edit ---------- */
function viewRegister(ic,edit){
  tabs(false);
  var p=edit?S.session.profile:{ic:ic,role:'MO',name:'',regNo:'',workplace:'',phone:'01',email:''};
  app.innerHTML='<form id="f" class="card fade" novalidate><h2>'+(edit?'Edit your details':'First time here')+'</h2><p class="muted">'+(edit?'Your IC cannot be changed.':'Fill this in once. Next time, just enter your IC.')+'</p>'+
  '<label class="lbl">IC number</label><input class="ro" readonly value="'+esc(p.ic)+'">'+
  '<label class="lbl">I am a</label><div class="seg">'+['MO','AMO','NURSE'].map(function(r){return '<label class="opt"><input type="radio" name="role" value="'+r+'"'+(p.role===r?' checked':'')+'><span>'+ROLE[r].short+'</span></label>'}).join('')+'</div>'+
  '<label class="lbl" for="name">Full name (as in IC)</label><input id="name" autocomplete="name" value="'+esc(p.name)+'">'+
  '<label class="lbl" for="regNo" id="regL"></label><input id="regNo" autocomplete="off" value="'+esc(p.regNo)+'">'+
  '<label class="lbl" for="workplace">Place of work</label><input id="workplace" placeholder="Hospital / clinic" value="'+esc(p.workplace)+'">'+
  '<label class="lbl" for="phone">Phone number</label><input id="phone" type="tel" inputmode="numeric" autocomplete="tel" value="'+esc(p.phone||'01')+'">'+
  '<label class="lbl" for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" value="'+esc(p.email)+'">'+
  '<button class="btn" type="submit">'+(edit?'Save changes':'Save & continue')+'</button>'+(edit?'<button class="btn ghost" type="button" id="cx">Cancel</button>':'<button class="btn ghost" type="button" id="cx">Use a different IC</button>')+'</form>';
  var f=$('#f');
  function role(){return $('input[name=role]:checked',f).value}
  function setReg(){$('#regL').textContent=ROLE[role()].reg}
  setReg();$$('input[name=role]',f).forEach(function(r){r.addEventListener('change',setReg)});
  var ph=$('#phone');
  ph.addEventListener('input',function(){
    var v=ph.value.replace(/\D/g,'');
    if(v.indexOf('01')!==0)v='01'+v.replace(/^0*1?/,'');
    ph.value=v.slice(0,11);
    if(ph.value.length===11)$('#email').focus();
  });
  ph.addEventListener('focus',function(){if(!ph.value)ph.value='01';setTimeout(function(){ph.setSelectionRange(ph.value.length,ph.value.length)},0)});
  var order=['name','regNo','workplace','phone','email'];
  f.addEventListener('keydown',function(e){
    if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type==='radio')return;
    e.preventDefault();var i=order.indexOf(e.target.id);
    if(i>=0&&i<order.length-1)$('#'+order[i+1]).focus();else f.requestSubmit();
  });
  f.addEventListener('input',function(e){e.target.classList.remove('bad');var n=e.target.nextElementSibling;if(n&&n.className==='fe')n.remove()});
  $('#cx').onclick=function(){edit?viewBook():viewIC()};
  if(!edit)$('#name').focus();
  f.addEventListener('submit',function(e){
    e.preventDefault();
    $$('.fe',f).forEach(function(x){x.remove()});
    var d={ic:p.ic,role:role(),name:$('#name').value.trim(),regNo:$('#regNo').value.trim(),workplace:$('#workplace').value.trim(),phone:$('#phone').value,email:$('#email').value.trim()};
    var bad=null;
    if(d.name.length<3)bad=['name','Please enter your full name.'];
    else if(!d.regNo)bad=['regNo','This number is required.'];
    else if(!d.workplace)bad=['workplace','Place of work is required.'];
    else if(!/^01\d{8,9}$/.test(d.phone))bad=['phone','Phone must start with 01 and have 10–11 digits.'];
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email))bad=['email','Please enter a valid email.'];
    if(bad){var el=$('#'+bad[0]);el.classList.add('bad');el.insertAdjacentHTML('afterend','<p class="fe">'+bad[1]+'</p>');el.focus();return}
    var b=$('.btn',f);busy(b,true,'Saving…');
    api('register',{profile:d,token:edit?S.session.token:undefined}).then(function(j){saveSession({token:j.token,profile:j.profile});viewBook()},function(err){busy(b,false);fail(err)});
  });
}

/* ---------- book ---------- */
function myType(){return S.session.profile.role==='MO'?'mo':'para'}
function dayState(d){
  var t=myType(),open=false,all=true;
  d.slots.forEach(function(s){if(!s.closed){all=false;if(s[t].left>0)open=true}});
  return all?'closed':open?'open':'full';
}
function loadBook(force){
  if(!force&&S.avail&&Date.now()-S.availAt<60000&&S.mine)return Promise.resolve();
  return Promise.all([api('availability',null,true),api('mine',{token:S.session.token})]).then(function(r){S.avail=r[0];S.availAt=Date.now();S.mine=r[1].bookings;CUTOFF=r[1].cutoff||CUTOFF});
}
function viewBook(){
  tabs(true,'book');
  var p=S.session.profile;
  app.innerHTML='<section class="card fade"><div class="me"><div class="av">'+esc(p.name.charAt(0))+'</div><div style="flex:1;min-width:0"><b>'+esc(p.name)+'</b><small><span class="badge">'+ROLE[p.role].short+'</span> '+esc(p.regNo)+'</small></div></div>'+
  '<div style="display:flex;gap:4px;margin-top:8px"><button class="link" id="ed">Edit details</button><button class="link" id="lo">Sign out</button></div></section>'+
  '<h2 class="sec" style="font-size:16px">Choose a date <span id="mon"></span></h2><div class="dates" id="dates"><div class="sk" style="flex:0 0 58px;height:84px"></div><div class="sk" style="flex:0 0 58px;height:84px"></div><div class="sk" style="flex:0 0 58px;height:84px"></div><div class="sk" style="flex:0 0 58px;height:84px"></div><div class="sk" style="flex:0 0 58px;height:84px"></div></div><div class="slots" id="slots"><div class="sk" style="height:110px"></div><div class="sk" style="height:110px"></div></div>';
  $('#ed').onclick=function(){viewRegister(p.ic,true)};$('#lo').onclick=logout;
  loadBook().then(function(){
    var days=S.avail.days;
    if(!S.sel||!days.some(function(d){return d.date===S.sel}))S.sel=(days.filter(function(d){return dayState(d)==='open'})[0]||days[0]).date;
    $('#dates').innerHTML=days.map(function(d){var dt=pd(d.date);return '<button class="d '+dayState(d)+'" data-d="'+d.date+'" aria-label="'+fmtLong(d.date)+'"><small>'+dt.toLocaleDateString('en-MY',{weekday:'short'})+'</small><b>'+dt.getDate()+'</b><i></i></button>'}).join('');
    $$('.d').forEach(function(b){b.onclick=function(){S.sel=b.dataset.d;paint(true)}});
    paint(true);
  },fail);
}
function paint(scroll){
  var d=S.avail.days.filter(function(x){return x.date===S.sel})[0];if(!d)return;
  $$('.d').forEach(function(b){var on=b.dataset.d===S.sel;b.classList.toggle('sel',on);if(on&&scroll)b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})});
  $('#mon').textContent=pd(S.sel).toLocaleDateString('en-MY',{month:'long',year:'numeric'});
  var t=myType(),p=S.session.profile;
  var h='<div class="sec" style="margin-top:6px"><b>'+fmtLong(d.date)+'</b>'+(d.holiday?'<span class="badge hol">Public holiday</span>':'')+'</div>';
  h+=d.slots.map(function(s,i){
    var mine=S.mine.filter(function(b){return b.date===d.date&&b.slot===s.key})[0];
    var st=s.closed?'closed':mine?'booked':s[t].left<=0?'full':'open';
    var lab={open:'Available',full:'Full',closed:'Closed',booked:'Booked ✓'}[st];
    return '<button class="slot '+st+'" data-i="'+i+'" '+(st==='open'?'':'disabled')+'><div class="t"><span>'+s.label+'</span><span class="st '+st+'">'+lab+'</span></div>'+
      '<div class="chips"><span class="chip'+(t==='mo'?' you':'')+'">MO · '+s.mo.left+' of '+s.mo.total+' left</span><span class="chip'+(t==='para'?' you':'')+'">Paramedic · '+s.para.left+' of '+s.para.total+' left</span></div></button>';
  }).join('');
  var el=$('#slots');el.innerHTML=h;
  $$('.slot.open',el).forEach(function(b){b.onclick=function(){confirmBook(d,d.slots[+b.dataset.i])}});
}
function confirmBook(d,s){
  var p=S.session.profile;
  openSheet('<h3>Confirm booking</h3><dl><dt>Date</dt><dd>'+fmtLong(d.date)+'</dd><dt>Time</dt><dd>'+s.label+'</dd><dt>As</dt><dd>'+ROLE[p.role].name+'</dd><dt>Name</dt><dd>'+esc(p.name)+'</dd><dt>Phone</dt><dd>'+esc(p.phone)+'</dd><dt>Email</dt><dd>'+esc(p.email)+'</dd></dl>'+
  lastMinuteWarn()+'<p class="hint">A confirmation email will be sent to you.</p><button class="btn" id="ok">Confirm booking</button><button class="btn ghost" data-close>Cancel</button>');
  $('#ok').onclick=function(){
    var b=$('#ok');busy(b,true,'Booking…');
    api('book',{token:S.session.token,date:d.date,slot:s.key}).then(function(j){
      S.avail=null;S.mine=null;
      openSheet('<svg class="tick" viewBox="0 0 72 72"><circle cx="36" cy="36" r="34"/><path d="M22 37l10 10 18-20"/></svg><h3 style="text-align:center">You\'re booked!</h3><p class="muted" style="text-align:center">'+fmtLong(j.booking.date)+'<br>'+j.booking.label+' · Ref '+j.booking.id+'</p><button class="btn" id="mb">View my bookings</button><button class="btn ghost" id="dn">Book another</button>');
      $('#mb').onclick=function(){closeSheet();viewMine()};$('#dn').onclick=function(){closeSheet();viewBook()};
    },function(e){closeSheet();fail(e);if(!e.expired){S.avail=null;S.mine=null;viewBook()}});
  };
}

/* ---------- my bookings (lazy) ---------- */
function viewMine(){
  tabs(true,'mine');
  app.innerHTML='<h2 class="sec" style="font-size:16px;margin-top:6px">My upcoming bookings</h2><div id="list"><div class="sk" style="height:96px;margin-bottom:12px"></div><div class="sk" style="height:96px"></div></div>';
  api('mine',{token:S.session.token}).then(function(j){
    S.mine=j.bookings;CUTOFF=j.cutoff||CUTOFF;
    var l=$('#list');
    if(!j.bookings.length){l.innerHTML='<div class="empty fade">No upcoming bookings yet.<br><button class="link" id="go">Book a slot</button></div>';$('#go').onclick=viewBook;return}
    l.innerHTML=j.bookings.map(function(b){return '<div class="card item fade"><div class="r"><h3>'+fmtLong(b.date)+'</h3></div><div class="r"><span>'+b.label+' · <span class="badge">'+b.seat.replace('PARA','Paramedic')+'</span></span>'+(b.canCancel?'<button class="link" style="color:var(--bad)" data-id="'+b.id+'">Cancel</button>':'')+'</div>'+(b.canCancel?'<p class="hint">Free cancellation until '+cancelDeadline(b,j.cutoff)+'</p>':warnBox('Cancellation is closed','This slot starts within '+j.cutoff+' hours. You must <b>find a replacement yourself</b>, then contact the admin to cancel your slot and pass it to the new booker.'))+'<p class="hint">Ref '+b.id+'</p></div>'}).join('');
    $$('[data-id]',l).forEach(function(x){x.onclick=function(){
      var b=S.mine.filter(function(m){return m.id===x.dataset.id})[0];
      openSheet('<h3>Cancel this booking?</h3><p class="muted">'+fmtLong(b.date)+'<br>'+b.label+'</p><button class="btn danger" id="yes">Yes, cancel booking</button><button class="btn ghost" data-close>Keep it</button>');
      $('#yes').onclick=function(){var y=$('#yes');busy(y,true,'Cancelling…');
        api('cancel',{token:S.session.token,id:b.id}).then(function(){S.avail=null;closeSheet();toast('Booking cancelled');viewMine()},function(e){closeSheet();fail(e)})};
    }});
  },fail);
}

/* ---------- boot ---------- */
$$('#tabs button').forEach(function(b){b.onclick=function(){b.dataset.tab==='book'?viewBook():viewMine()}});
S.session=loadSession();
if(!CFG.API_URL||CFG.API_URL.indexOf('PASTE')===0){app.innerHTML='<div class="card"><h2>Almost there</h2><p class="muted">Set API_URL in config.js to your Apps Script web app URL.</p></div>'}
else if(S.session)viewBook();else viewIC();
})();
</script>
</body>
</html>
